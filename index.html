const BLUR_MIN = 60, DARK_MIN = 45, SIZE_MIN = 400;
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }

  if (Math.min(W, Hh) < SIZE_MIN) return { ok: false, code: 'small', W, H: Hh };
  const sc = Math.min(1, 360 / Math.max(W, Hh));

  else if (h.state === 'busy') ex = `<p class="sm">${spin()} अनुवाद हो रहा है…</p>`;
  else if (cur) ex = `<p style="white-space:pre-wrap">${esc(h.out)}</p><p class="xs mut">${h.state === 'sample' ? 'सैंपल अनुवाद: लाइव AI इस व्यू में उपलब्ध नहीं। ' : 'AI अनुवाद। '}यह इस समय के अंग्रेज़ी विवरण से मेल खाता है।</p>`;
  else ex = `${h.out ? '<p class="xs" style="color:var(--amb)">पिछला अनुवाद पुराना है क्योंकि विवरण बदला। दोबारा अनुवाद करें।</p>' : ''}${h.state === 'error' ? alertBox('amb', 'alert', 'AI उपलब्ध नहीं। नीचे आपके मूल शब्द देखें और अंग्रेज़ी टेक्स्ट किसी भरोसेमंद व्यक्ति से जँचवाएँ।') : ''}<button class="btn sm out" data-act="hiAsk">हिंदी अनुवाद दिखाएँ</button>`;
  return `<div class="card blu"><h2>पत्र का हिंदी सारांश</h2><p class="xs mut">पत्र अंग्रेज़ी में जाएगा। यह सारांश आपके चुने तथ्यों और अटैचमेंट से बनता है। ${S.letterEdited ? '<b style="color:var(--amb)">आपने पत्र खुद बदला है; यह सारांश आपके बदलावों को नहीं दिखाता। बदला हुआ अंग्रेज़ी पत्र ध्यान से पढ़ें।</b>' : ''}</p>
   <p><b>तथ्य:</b> ${esc(M.nameHi)}, लखनऊ। आप ${inr(H.amount)} के पेमेंट ${H.payId} (UTR ${H.utr}) को 6 अक्टूबर 2026 की अपनी दुकान की बिक्री के रूप में पहचानते हैं${b.invoice_no ? ' (बिल ' + esc(b.invoice_no) + ')' : ''}। यह पेमेंट पुलिस शिकायत संदर्भ ${H.ncrp} से जुड़े होल्ड पर है।</p>

   <p><b>अनुरोध:</b> Razorpay संलग्न रिकॉर्ड देखे और संतुष्ट होने पर लागू शिकायत प्रक्रिया के ज़रिए जाँच प्राधिकरण से समन्वय करे। निर्णय जाँच अधिकारी का होता है।</p>

function railPitch() {
  return `<div class="pn"><h2>Payment Hold Help</h2>
    <p class="quote">When police hold a payment, a Razorpay merchant should understand the hold and get a complete grievance to Razorpay fast. Target: prepare and submit to Razorpay in under two minutes, with evidence ready.</p>
    <p class="fine">Proposed feature inside the Razorpay Payments for Business mobile app. Contextual, not a sixth tab. Track 1: one merchant job, done well on mobile.</p>
    <h4>Why it matters</h4><p>About ₹8.26 lakh was frozen from August 2025 until a June 2026 High Court order directed defreezing over a ₹1,000 sale.</p>
    <p class="fine">Sri Sai Wines v. Union of India, W.P. 969/2026, Andhra Pradesh High Court, order of 22 June 2026. The order names no payment aggregator. It shows how severe a hold can be, not how often Razorpay merchants face one. It directs defreezing; it is not evidence of when the bank actually released the funds.</p>
    <h4>Why now</h4><ul><li>MHA SOP for NCRP-CFCFRMS (2 Jan 2026) puts grievances on fixed clocks.</li><li>Supreme Court directed nationwide adoption on 9 Feb 2026.</li><li>PIB reports the grievance module functional since April 2026.</li></ul>
    <h4>The job</h4><p>Suresh, a Lucknow phone-shop owner who prefers Hindi, sees a hold on one ₹14,999 QR payment. He needs to understand it, assemble evidence of the sale and get a complete grievance to Razorpay, from his phone, between customers.</p>
    <h4>What is different</h4><p>Integrated hold context, Razorpay payment records, evidence preparation and institutional coordination, inside the app he already uses. We do not claim to be the first or only approach.</p>
    <h4>How merchants cope today (hypothesis, not observed)</h4><p>Notice the hold, probably through a settlement shortfall. Call support or the bank. Work out which payment is involved. Dig out the bill and chat. Write an explanation. Follow up with no clear clock. We have not interviewed merchants; validating this is the first next step.</p>
    <h4>Why mobile, and three decisions</h4><p>The camera (bill, counter), the customer chat, the QR payment and Hindi assistance are all already on the phone, and the merchant is between customers. Decisions: start from the hold, not a form; reuse authoritative payment records; keep AI optional with the merchant reviewing everything.</p>
    <h4>How AI was used in the build</h4><p>Claude and Claude Code built the prototype, the English and Hindi copy and the sample assets, verified claims against primary sources such as the official SOP, and ran scripted browser tests across the main flow, all five tracker outcomes, the failure states, Hindi and a phone-width dark-mode view. ChatGPT/Codex audited the notes and source over several rounds; each finding was checked against sources or reproduced before any change. The team also checked the prototype in the browser by hand. Example: an audit flagged the tracker; a test reproduced it (after escalation, the next update jumped back to the 22/23 Oct release dates); it was rebuilt as separate forward-only timelines per outcome. No productivity multiple is claimed.</p>
    <h4>Measurement</h4><ul><li><b>North star:</b> first-time completeness, the share of packs accepted as complete for institutional filing without further merchant documents. It works whether Razorpay or its nodal bank files, and it does not mean approval.</li><li>Submission to confirmed filing (SOP limit for institutions: 7 calendar days).</li><li>Active time to submit, measured without autofill.</li><li>External outcomes (15-day decisions, release time) tracked against a baseline before attributing any change.</li><li>Guardrails: wrong AI extraction, mismatched payments, missed deadlines, duplicate filings, misleading status.</li></ul>
    <h4>Not built</h4><p>Direct filing into police systems, refunds or unfreezing, a lawyer marketplace, chargebacks, generic KYC or risk-review tools.</p></div>`;
}

function railAssume() {
  return `<div class="pn"><h2>Assumptions requiring confirmation</h2><ul>
    <li><b>Filing route.</b> Whether Razorpay files in the grievance module itself or through its nodal bank under the SOP's alternate arrangements. The SOP does not explicitly assign filing to Razorpay.</li>
    <li><b>7-day filing target.</b> Applying the SOP's institution timeline to Razorpay.</li>
    <li><b>Status visibility.</b> What grievance status Razorpay can see and share, and when it may notify merchants.</li>
    <li><b>Incidence.</b> How often Razorpay merchants face police-linked holds, and how much delay comes from incomplete evidence rather than institutional handling.</li>
    <li><b>Two minutes.</b> A target. Unproven without autofill, with missing evidence or several complaints.</li>
    <li><b>OTP.</b> Whether OTP is enough, or a recognised e-signature is needed.</li>

setInterval(() => { const t = $('#tm'); if (t && S.t0 && !S.tEnd) t.textContent = mmss(Date.now() - S.t0); }, 500);

function copyText(text, btn) {

async function helper(v) {
  if (v === 'bill' || v === 'blur') { const a = await sampleAsset(v === 'blur' ? 'bill-blur' : 'bill'); await setEvidence('bill', a.url, a.blob, true); }
  else if (v === 'hand' || v === 'chat') { const a = await sampleAsset(v); await setEvidence(v, a.url, a.blob, true); }
  else if (v === 'imei') { S.imei = SAMPLE_IMEI; S.imeiFrom = 'sample'; markStale(); render(true); }
  else if (v === 'words') { S.words = SAMPLE_WORDS; render(true); }
  else if (v === 'resp') { const a = await sampleAsset('chat'); S.respDoc = { url: a.url }; render(true); }
  else if (v === 'all') {
    for (const k of ['bill', 'hand', 'chat']) { const a = await sampleAsset(k); await setEvidence(k, a.url, a.blob, true); }
    S.imei = SAMPLE_IMEI; S.words = SAMPLE_WORDS; S.expl = SAMPLE_WORDS_EN; S.explSrc = 'sample';

function act(a, v, el) {

    case 'viewHold': go('hold'); break;
    case 'payOpen': go('payDetail'); break;

    case 'toSettle': S.tab = 'payments'; S.pay = 'settlements'; S.stack = []; render(); break;

    case 'bankOpen': go('bank'); break;

    case 'askWords': if (!(S.words || '').trim()) { toast(L('Write a few lines first.', 'पहले कुछ पंक्तियाँ लिखें।')); break; } S.askW = '1'; render(true); break;
    case 'cancelAsk': S.askW = ''; render(true); break;
    case 'doWords': makeExplanation(); break;
    case 'useWords': if (!(S.words || '').trim()) { toast(L('Write a few lines first.', 'पहले कुछ पंक्तियाँ लिखें।')); break; } S.expl = S.words.trim(); S.explSrc = 'own'; S.wordsState = ''; markStale(); render(true); break;
    case 'rm': delete S.ev[v]; if (v === 'bill') { S.bill = null; S.billState = ''; S.ask = ''; } markStale(); render(true); break;
    case 'retry': retryEv(v); break;
    case 'saveDraft': S.draftAt = Date.now(); toast(L('Draft saved. Your documents and text stay if you change language or go back.', 'ड्राफ़्ट सेव हुआ। भाषा बदलने या पीछे जाने पर भी आपके दस्तावेज़ और टेक्स्ट रहेंगे।')); render(true); break;
    case 'toSubmit': {
      const it = S.ev.bill;
      if (!okEv('bill') || (S.ev.hand && S.ev.hand.status === 'checking') || (S.ev.chat && S.ev.chat.status === 'checking')) { S.errMissing = true; render(true); const b = $('.body', app); if (b) b.scrollTop = 0; break; }
      S.errMissing = false; go('submit'); break;

    case 'okLetter': S.letterStale = false; S.ack = false; render(true); break;
    case 'fixEncl': { const lines = enclosures().map((e, i) => `${i + 1}. ${e.l}`).join('\n'); const m = /(Enclosed:\n)([\s\S]*?)(\n\nI request)/.exec(S.letter); if (m) { S.letter = S.letter.replace(m[0], m[1] + lines + m[3]); S.letterStale = false; S.ack = false; } else toast(L('Could not find the enclosure list. Reset the letter or check it yourself.', 'संलग्नक सूची नहीं मिली। पत्र रीसेट करें या खुद जाँचें।')); render(true); break; }

    case 'closeSheet': S.sheet = null; render(true); break;

  }
